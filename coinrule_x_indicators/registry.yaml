# Coinrule X Indicator Registry
indicators:
  rsi:
    latest: "1.0.0"
    label: "RSI"
    versions:
      "1.0.0":
        class: "coinrule_x_indicators.indicators.rsi.RSI"
        description: "Relative Strength Index"
        arguments:
          period:
            type: int
            default: 14
            label: "Length"
            description: "Number of periods for RSI calculation"
  rsi_sma:
    latest: "1.0.0"
    label: "RSI SMA"
    versions:
      "1.0.0":
        class: "coinrule_x_indicators.indicators.rsi_sma.RSISMA"
        description: "Simple Moving Average of RSI"
        arguments:
          rsi_period:
            type: int
            default: 14
            label: "RSI Length"
            description: "RSI Lookback period"
          sma_period:
            type: int
            default: 14
            label: "Smoothing Length"
            description: "Simple Moving Average period"
  mfi:
    latest: "1.0.0"
    label: "MFI"
    versions:
      "1.0.0":
        class: "coinrule_x_indicators.indicators.mfi.MFI"
        description: "Money Flow Index"
        arguments:
          period:
            type: int
            default: 14
            label: "Length"
            description: "Number of periods for MFI calculation"
  sma:
    latest: "1.0.0"
    label: "SMA"
    versions:
      "1.0.0":
        class: "coinrule_x_indicators.indicators.sma.SMA"
        description: "Simple Moving Average"
        arguments:
          period:
            type: int
            default: 9
            label: "Length"
            description: "Moving Average period"
  ema:
    latest: "1.0.0"
    label: "EMA"
    versions:
      "1.0.0":
        class: "coinrule_x_indicators.indicators.ema.EMA"
        description: "Exponential Moving Average"
        arguments:
          period:
            type: int
            default: 9
            label: "Length"
            description: "Exponential Moving Average period"
  macd:
    latest: "1.0.0"
    label: "MACD"
    versions:
      "1.0.0":
        class: "coinrule_x_indicators.indicators.macd.MACD"
        description: "Moving Average Convergence Divergence"
        arguments:
          fast:
            type: int
            default: 12
            label: "Fast length"
            description: "Fast EMA period"
          slow:
            type: int
            default: 26
            label: "Slow length"
            description: "Slow EMA period"
          signal:
            type: int
            default: 9
            label: "Signal length"
            description: "Signal line EMA period"
  volume_sma:
    latest: "1.0.0"
    label: "Volume SMA"
    versions:
      "1.0.0":
        class: "coinrule_x_indicators.indicators.volume_sma.VolumeSMA"
        description: "Simple Moving Average of Volume"
        arguments:
          period:
            type: int
            default: 20
            label: "MA Length"
            description: "Volume SMA period"
  bb:
    latest: "1.0.0"
    label: "Bollinger Bands"
    versions:
      "1.0.0":
        class: "coinrule_x_indicators.indicators.bb.BollingerBands"
        description: "Bollinger Bands"
        arguments:
          period:
            type: int
            default: 20
            label: "Length"
            description: "Bollinger Bands period"
          std_dev:
            type: float
            default: 2.0
            label: "Multiplier"
            description: "Standard Deviation Multiplier"
  atr:
    latest: "1.0.0"
    label: "ATR"
    versions:
      "1.0.0":
        class: "coinrule_x_indicators.indicators.atr.ATR"
        description: "Average True Range"
        arguments:
          period:
            type: int
            default: 14
            label: "Length"
            description: "Number of periods for ATR calculation"
  adx:
    latest: "1.0.0"
    label: "ADX"
    versions:
      "1.0.0":
        class: "coinrule_x_indicators.indicators.adx.ADX"
        description: "Average Directional Index"
        arguments:
          period:
            type: int
            default: 14
            label: "Length"
            description: "Number of periods for ADX calculation"
  donchian:
    latest: "1.0.0"
    label: "Donchian Channels"
    versions:
      "1.0.0":
        class: "coinrule_x_indicators.indicators.donchian.DonchianChannels"
        description: "Donchian Channels (Max High / Min Low)"
        arguments:
          period:
            type: int
            default: 20
            label: "Length"
            description: "Lookback period for High/Low"
  unrealized_profit:
    latest: "1.0.0"
    label: "Unrealized Profit"
    versions:
      "1.0.0":
        class: "coinrule_x_indicators.indicators.unrealized_profit.UnrealizedProfit"
        description: "Position Unrealized Profit"
  liquidation_price:
    latest: "1.0.0"
    label: "Liquidation Price"
    versions:
      "1.0.0":
        class: "coinrule_x_indicators.indicators.liquidation_price.LiquidationPrice"
        description: "Position Liquidation Price"
  market_cap:
    latest: "1.0.0"
    label: "Market Cap"
    versions:
      "1.0.0":
        class: "coinrule_x_indicators.indicators.market_cap.MarketCap"
        description: "Asset Market Capitalization (USD)"
  webhook_signal:
    latest: "1.0.0"
    label: "Webhook Signal"
    versions:
      "1.0.0":
        class: "coinrule_x_indicators.indicators.webhook_signal.WebhookSignal"
        description: "Third-party Webhook Signal"
  stochastic_rsi:
    latest: "1.0.0"
    label: "Stochastic RSI"
    versions:
      "1.0.0":
        class: "coinrule_x_indicators.indicators.stochastic_rsi.StochasticRSI"
        description: "Stochastic RSI %K and %D"
        arguments:
          period:
            type: int
            default: 14
            label: "Length"
            description: "RSI length and stochastic lookback"
  supertrend:
    latest: "1.0.0"
    label: "Supertrend"
    versions:
      "1.0.0":
        class: "coinrule_x_indicators.indicators.supertrend.SuperTrend"
        description: "Supertrend band"
        arguments:
          period:
            type: int
            default: 10
            label: "ATR Length"
            description: "ATR lookback used for the bands"
          multiplier:
            type: float
            default: 3.0
            label: "Multiplier"
            description: "ATR multiplier. Legacy rules use 3"
  twap:
    latest: "1.0.0"
    label: "TWAP"
    versions:
      "1.0.0":
        class: "coinrule_x_indicators.indicators.twap.TWAP"
        description: "Time-weighted average price over an anchor window"
        arguments:
          anchor_ms:
            type: int
            default: 3600000
            label: "Anchor"
            description: "Anchor window in milliseconds"
  vwap:
    latest: "1.0.0"
    label: "VWAP"
    versions:
      "1.0.0":
        class: "coinrule_x_indicators.indicators.vwap.VWAP"
        description: "Volume-weighted average price over an anchor window"
        arguments:
          anchor_ms:
            type: int
            default: 3600000
            label: "Anchor"
            description: "Anchor window in milliseconds"
  vix:
    latest: "1.0.0"
    label: "VIX"
    versions:
      "1.0.0":
        class: "coinrule_x_indicators.indicators.vix.VIX"
        description: "Latest market-wide VIX close"
  btc_dominance:
    latest: "1.0.0"
    label: "BTC Dominance"
    versions:
      "1.0.0":
        class: "coinrule_x_indicators.indicators.btc_dominance.BtcDominance"
        description: "Latest market-wide BTC dominance close"
